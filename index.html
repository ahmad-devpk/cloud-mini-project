<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnicasa Cloud Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background-color: #0078d4; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; background: white; color: #0078d4; padding: 5px 15px; border-radius: 6px; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .status-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .main-status { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: #2e7d32; border-bottom: 2px solid #eef2f5; padding-bottom: 20px; margin-bottom: 25px; }
        .circle-icon { width: 24px; height: 24px; background-color: #2e7d32; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .service-item { margin-bottom: 25px; }
        .service-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
        .uptime-text { color: #2e7d32; }
        .bar-container { display: flex; gap: 3px; }
        .bar { flex: 1; height: 35px; background-color: #2e7d32; border-radius: 3px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: #777; margin-top: 6px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">omnicasa</div>
        <div>
            <button style="background: transparent; color: white; border: 1px solid white; padding: 8px 15px; border-radius: 6px; margin-right: 10px; cursor: pointer;">Report an issue</button>
            <button style="background: white; color: #0078d4; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; cursor: pointer;">Get updates</button>
        </div>
    </header>

    <div class="container">
        <div class="status-card">
            <div class="main-status">
                <div class="circle-icon">✓</div>
                <span>All systems operational</span>
            </div>

            <!-- Website Service -->
            <div class="service-item">
                <div class="service-header">
                    <span>Website</span>
                    <span class="uptime-text">100.0% uptime</span>
                </div>
                <div class="bar-container" id="website-bars"></div>
                <div class="time-labels">
                    <span>&lt; 90 DAYS AGO</span>
                    <span>TODAY</span>
                </div>
            </div>

            <!-- App Service -->
            <div class="service-item">
                <div class="service-header">
                    <span>App</span>
                    <span class="uptime-text">100.0% uptime</span>
                </div>
                <div class="bar-container" id="app-bars"></div>
                <div class="time-labels">
                    <span>&lt; 90 DAYS AGO</span>
                    <span>TODAY</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function createBars(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                container.appendChild(bar);
            }
        }
        createBars('website-bars');
        createBars('app-bars');
    </script>
</body>
</html>
